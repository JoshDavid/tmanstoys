<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TMANSTOYS</title>

<style>

body {

margin: 0;

font-family: Arial, sans-serif;

background: #f6f6f3;

color: #2b2b2b;

}

header {

background: #f3dd24;

padding: 1rem 2rem;

text-align: center;

box-shadow: 0 2px 5px rgba(0,0,0,0.1);

}

header h1 {

margin: 0;

font-size: 2.5rem;

color: #1f1f1f;

}

.hero {

width: 100%;

max-height: 400px;

object-fit: cover;

object-position: center 35%;

display: block;

border-bottom: 5px solid #00c709;

}

.content {

max-width: 900px;

margin: 3rem auto;

padding: 0 1.5rem;

text-align: center;

}

.content h2 {

font-size: 1.7rem;

color: #3a5f7d;

margin-bottom: 1rem;

}

.content img {

width: 100%;

height: auto;

border-radius: 10px;

box-shadow: 0 6px 14px rgba(0,0,0,0.12);

}

.footer-image {

background-color: #ffffff;

padding: 2rem 1rem;

text-align: center;

border-top: 4px solid #6bbf59;

}

.footer-image img {

max-width: 100%;

max-height: 300px;

height: auto;

width: auto;

display: block;

margin: auto;

}

.email-section {

background-color: #f6f6f3;

text-align: center;

padding: 2rem 1rem;

}

.email-btn {

display: inline-block;

background-color: #f3dd24;

color: #1f1f1f;

text-decoration: none;
font-family: Arial, sans-serif;
font-size: 1.1rem;
font-weight: bold;
padding: 0.85rem 2.2rem;
border-radius: 8px;
box-shadow: 0 4px 10px rgba(0,0,0,0.15);
transition: background-color 0.2s, transform 0.1s;
border: none;
cursor: pointer;
}

.email-btn:hover {

background-color: #e0c900;
transform: translateY(-2px);

}

.email-btn:active {

transform: translateY(0);

}

footer {

background-color: #3a5f7d;

color: white;

text-align: center;

padding: 1rem;

font-size: 0.9rem;

}

</style>

</head>

<body>

<header>

<h1>TMANSTOYS</h1>

</header>

<img

class="hero"

src="/assets/images/mp1.png"

>

<!-- BODY CONTENT -->

<section class="content">

<h2 id="shop">We Buy & Sell Toys</h2>

<img

src="assets/images/ti1.jpg"

/>

</section>

<!-- FOOTER IMAGE -->

<div class="footer-image">

<img

src="/assets/images/tb2.jpg"

/>

</div>

<!-- EMAIL BUTTON -->
<div class="email-section">
  <a class="email-btn" href="mailto:mark@tmanstoys.com">
    ✉ Contact Us: mark@tmanstoys.com
  </a>
</div>

<!-- FOOTER -->

<footer>

TMANSTOYS

</footer>

</body>

</html>
